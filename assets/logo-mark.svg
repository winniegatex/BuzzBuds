<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none" aria-hidden="true">
  <style>
    .logo-left { animation: bud-left 2.4s ease-in-out infinite; transform-origin: 80px 70px; }
    .logo-right { animation: bud-right 2.4s ease-in-out infinite; transform-origin: 160px 70px; }
    .logo-heart { animation: heart-glow 1.6s ease-in-out infinite; transform-origin: 120px 100px; }
    @keyframes bud-left { 0%,100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
    @keyframes bud-right { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-3px); } }
    @keyframes heart-glow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .logo-left, .logo-right, .logo-heart { animation: none; } }
  </style>
  <g class="logo-left">
    <path fill="#F97B6E" d="M28 28c0-14 12-26 26-26h62c14 0 26 12 26 26v62c0 14-12 26-26 26H70l-28 22 8-28c-14-4-22-16-22-30V28z"/>
    <circle cx="78" cy="62" r="7" fill="#2A1224"/>
    <path stroke="#2A1224" stroke-width="5" stroke-linecap="round" d="M62 86c10 12 32 12 42 0"/>
    <ellipse cx="68" cy="70" rx="10" ry="6" fill="#F97B6E" opacity=".35"/>
  </g>
  <g class="logo-right">
    <path fill="#F2709C" d="M96 28c0-14 12-26 26-26h62c14 0 26 12 26 26v62c0 14-8 26-22 30l8 28-28-22h-46c-14 0-26-12-26-26V28z"/>
    <circle cx="154" cy="62" r="7" fill="#2A1224"/>
    <path class="logo-wink" stroke="#2A1224" stroke-width="5" stroke-linecap="round" d="M142 86c10 12 32 12 42 0"/>
    <path class="logo-wink-line" stroke="#2A1224" stroke-width="5" stroke-linecap="round" d="M144 62c6-8 18-8 24 0" opacity="0"/>
    <path stroke="#FDE0E3" stroke-width="3" stroke-linecap="round" d="M178 50c8 2 14 10 14 18"/>
  </g>
  <g class="logo-heart">
    <path fill="#fff" d="M120 78c12-18 38-10 38 12 0 22-38 40-38 40s-38-18-38-40c0-22 26-30 38-12z"/>
    <path fill="#F55F73" d="M120 84c9-14 30-8 30 9 0 17-30 32-30 32s-30-15-30-32c0-17 21-23 30-9z"/>
  </g>
</svg>
